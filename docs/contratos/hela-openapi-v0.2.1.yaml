# Versión de OpenAPI
openapi: 3.0.3
# Información general
info:
  title: HELA API
  version: 0.2.1
  description: Contrato HTTP oficial de HELA. Define rutas, parámetros, solicitudes, respuestas, errores y trazabilidad 
    con los casos de uso CU-01 a CU-29. La tecnología de implementación se documenta en el SAD y no forma parte de este 
    contrato.
# Servidor local
servers:
  - url: http://localhost:3000
    description: Servidor local de la API
# Áreas funcionales
tags:
  - name: Autenticación
  - name: Usuarios y permisos
  - name: Restaurante y sucursales
  - name: Catálogo
  - name: Carta QR pública
  - name: Mesas y atención
  - name: Pedidos
  - name: Comandas
  - name: Caja
  - name: Pagos
  - name: Documentos
  - name: Inventario
  - name: Compras y proveedores
  - name: Reportes
  - name: Auditoría
  - name: Configuración
  - name: Administración SaaS
  - name: Impresión
# Seguridad por defecto
security:
  - bearerAuth: []
# Rutas de la API
paths:
# Autenticación
  /api/v1/autenticacion/sesiones:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      operationId: iniciarSesion
      x-hela-cu:
        - CU-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: []
  /api/v1/autenticacion/sesiones/renovar:
    post:
      tags:
        - Autenticación
      summary: Renovar sesión
      operationId: renovarSesion
      x-hela-cu:
        - CU-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: []
  /api/v1/autenticacion/sesiones/actual:
    delete:
      tags:
        - Autenticación
      summary: Cerrar sesión
      operationId: cerrarSesion
      x-hela-cu:
        - CU-01
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/Unauthorized'
# Usuarios y permisos
  /api/v1/usuarios:
    get:
      tags:
        - Usuarios y permisos
      summary: Listar usuarios
      operationId: listarUsuarios
      x-hela-cu:
        - CU-02
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaUsuarios'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Usuarios y permisos
      summary: Crear usuario
      operationId: crearUsuario
      x-hela-cu:
        - CU-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/usuarios/{usuarioId}:
    patch:
      tags:
        - Usuarios y permisos
      summary: Actualizar usuario
      operationId: actualizarUsuario
      x-hela-cu:
        - CU-02
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/roles:
    get:
      tags:
        - Usuarios y permisos
      summary: Listar roles
      operationId: listarRoles
      x-hela-cu:
        - CU-02
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRoles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Usuarios y permisos
      summary: Crear rol
      operationId: crearRol
      x-hela-cu:
        - CU-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolCrear'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/roles/{rolId}/permisos:
    put:
      tags:
        - Usuarios y permisos
      summary: Reemplazar permisos de un rol
      operationId: actualizarPermisosRol
      x-hela-cu:
        - CU-02
      parameters:
        - name: rolId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermisosRolActualizar'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
