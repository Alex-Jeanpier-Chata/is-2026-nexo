# Componentes reutilizables
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Autenticación ausente o inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El usuario no posee permiso, módulo o alcance suficiente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado dentro del alcance autorizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto de estado o regla de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Datos válidos sintácticamente pero no procesables.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExternalDependency:
      description: Dependencia externa no disponible o con respuesta inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: REGLA_NEGOCIO_INVALIDA
        mensaje:
          type: string
          example: La operación no puede completarse en el estado actual.
        detalles:
          type: array
          items:
            type: string
        traceId:
          type: string
    IdNombre:
      type: object
      required:
        - id
        - nombre
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
    PaginaMeta:
      type: object
      properties:
        pagina:
          type: integer
          minimum: 1
        tamano:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    UsuarioSesion:
      type: object
      required:
        - usuarioId
        - restauranteId
        - sucursalId
        - roles
        - permisos
        - modulos
      properties:
        usuarioId:
          type: string
          format: uuid
        nombre:
          type: string
        restauranteId:
          type: string
          format: uuid
        sucursalId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        permisos:
          type: array
          items:
            type: string
        modulos:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required:
        - usuario
        - contrasena
      properties:
        usuario:
          type: string
        contrasena:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - sesion
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        sesion:
          $ref: '#/components/schemas/UsuarioSesion'
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    Usuario:
      type: object
      required:
        - id
        - nombre
        - activo
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
          format: email
        activo:
          type: boolean
        roles:
          type: array
          items:
            type: string
        sucursalIds:
          type: array
          items:
            type: string
            format: uuid
    UsuarioCrear:
      type: object
      required:
        - nombre
        - email
        - rolIds
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        contrasenaTemporal:
          type: string
          minLength: 8
        rolIds:
          type: array
          items:
            type: string
            format: uuid
        sucursalIds:
          type: array
          items:
            type: string
            format: uuid
    UsuarioActualizar:
      type: object
      properties:
        nombre:
          type: string
        activo:
          type: boolean
        rolIds:
          type: array
          items:
            type: string
            format: uuid
        sucursalIds:
          type: array
          items:
            type: string
            format: uuid
    ListaUsuarios:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        meta:
          $ref: '#/components/schemas/PaginaMeta'
    Rol:
      type: object
      required:
        - id
        - nombre
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        permisos:
          type: array
          items:
            type: string
    RolCrear:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
        descripcion:
          type: string
    PermisosRolActualizar:
      type: object
      required:
        - permisos
      properties:
        permisos:
          type: array
          items:
            type: string
    Restaurante:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          type: string
          enum:
            - ACTIVO
            - SUSPENDIDO
            - CONFIGURACION
        ruc:
          type: string
        modulos:
          type: array
          items:
            type: string
    RestauranteActualizar:
      type: object
      properties:
        nombre:
          type: string
        ruc:
          type: string
        logoUrl:
          type: string
          format: uri
    Sucursal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        direccion:
          type: string
        activa:
          type: boolean
    SucursalCrear:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
        direccion:
          type: string
    SucursalActualizar:
      type: object
      properties:
        nombre:
          type: string
        direccion:
          type: string
        activa:
          type: boolean
    Categoria:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        visible:
          type: boolean
        orden:
          type: integer
    CategoriaGuardar:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
        visible:
          type: boolean
        orden:
          type: integer
    Producto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoriaId:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          format: double
          minimum: 0
        imagenUrl:
          type: string
          format: uri
        disponible:
          type: boolean
        visibleQr:
          type: boolean
        destinoPreparacion:
          type: string
          enum:
            - COCINA
