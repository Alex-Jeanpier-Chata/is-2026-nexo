      tags:
        - Pedidos
      summary: Validar o rechazar pedido temporal
      operationId: validarPedidoTemporal
      x-hela-cu:
        - CU-08
      description: Al confirmar una selección válida se crea un pedido oficial y el temporal queda convertido. Al 
